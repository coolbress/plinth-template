name: CI
#
# The template's own CI. What an instance receives is
# template/.github/workflows/ci.yml.jinja; GitHub runs only the root
# `.github/workflows/`, which is why the two are separate files.
#
# Keep the caller job named `ci`. Check names are `{caller job} / {job}`, and
# the ruleset requires `ci / lint`, `ci / test` and the rest by name; a renamed
# job never reports and the repository locks.
#
# The CI logic lives in coolbress/plinth, pinned to a commit SHA (tags move).
# The comment beside the SHA is the version it pointed at; Dependabot raises
# both.

on:
  push:
    branches: [main]
  # `edited` besides the default types: a retitled pull request re-runs the
  # title check, and an edited description re-reads the diff-size warning,
  # without a push (plinth #322).
  pull_request:
    types: [opened, synchronize, reopened, edited]
  # A review re-runs CI without a push. When a pull request changes how strict
  # the checks are, `ci / diff-size` fails until an admin approves the head;
  # the run this approval starts re-runs the latest red one, and the check
  # turns green. A dismissed approval makes it red again (plinth #586).
  pull_request_review:
    types: [submitted, dismissed]

# A new push to a pull request cancels the previous run; main is never
# cancelled. The group is keyed on the event: with one group for every
# event, the re-run of a push's run cancelled the review run that started it,
# and the merge was refused as `cancelled` (plinth #518).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The caller's permissions are the ceiling for the reusable workflow.
permissions:
  contents: read

jobs:
  ci:
    uses: coolbress/plinth/.github/workflows/python-ci.yml@9427c066cad8a5f9df801e05c1a7e73d6d965da4 # v2.0.1
    # A called workflow cannot widen what its caller grants: the label check
    # in `ci / floor-check` needs `issues: read`. `ci / diff-size` reads the
    # reviews and re-runs a red run after an approval (plinth #586); from
    # plinth v2.0.0 a call that does not grant these two fails at startup,
    # every check with it. Scoped to this job, not raised for the file.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: write
    with:
      # The default exclusions are `*.md` and `*.lock`; this repository also
      # has README.md.jinja and uv.lock.jinja, and `.jinja` is a rendering
      # instruction, not a new kind of file. Measured once without this line:
      # renaming uv.lock to uv.lock.jinja counted as 418 added lines.
      diff-size-exclude: "*.md *.md.jinja *.lock *.lock.jinja *lock.json *lock.yaml *lock.yml LICENSE"
