name: CI
#
# The template's own CI. What an instance receives is
# template/.github/workflows/ci.yml.jinja; GitHub runs only the root
# `.github/workflows/`, which is why the two are separate files.
#
# Keep the caller job named `ci`. Check names are `{caller job} / {job}`, and
# the ruleset requires `ci / lint`, `ci / test` and the rest by name; a renamed
# job never reports and the repository locks.
#
# The CI logic lives in coolbress/plinth, pinned to a commit SHA (tags move).
# The comment beside the SHA is the version it pointed at; Dependabot raises
# both.

on:
  push:
    branches: [main]
  # `edited` besides the default types: a retitled pull request re-runs the
  # title check, and an edited description re-reads the diff-size warning,
  # without a push (plinth #322).
  pull_request:
    types: [opened, synchronize, reopened, edited]

# A new push to a pull request cancels the previous run; main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The caller's permissions are the ceiling for the reusable workflow.
permissions:
  contents: read

jobs:
  ci:
    uses: coolbress/plinth/.github/workflows/python-ci.yml@8f4edfc95edf8239c582d068c0908cae59e47507 # v1.5.0
    # A called workflow cannot widen what its caller grants: the label check
    # in `ci / floor-check` needs `issues: read`, scoped to this job.
    permissions:
      contents: read
      issues: read
    with:
      # The default exclusions are `*.md` and `*.lock`; this repository also
      # has README.md.jinja and uv.lock.jinja, and `.jinja` is a rendering
      # instruction, not a new kind of file. Measured once without this line:
      # renaming uv.lock to uv.lock.jinja counted as 418 added lines.
      diff-size-exclude: "*.md *.md.jinja *.lock *.lock.jinja *lock.json *lock.yaml *lock.yml LICENSE"
