# Dependency updates. A person cannot check versions weekly; without this, the
# pins age in silence.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Grouped: one pull request per group, not one per package. Security
    # updates bypass grouping and schedule and open at once.
    groups:
      dev-tools:
        dependency-type: "development"
      runtime-minor:
        dependency-type: "production"
        update-types: ["minor", "patch"]

  # Actions and reusable workflows are pinned to commit SHAs; Dependabot
  # raises the SHA and the version comment beside it.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # The base images `template/Dockerfile.jinja` pins by digest (#266). The
  # file name matches Dependabot's `dockerfile` pattern and it reads only the
  # `FROM` lines, so the Jinja around them does not stop it. Digests and
  # patches only, as in the rendered `dependabot.yml.jinja`: a Python minor
  # moves both stages, `.python-version` and mypy's target together, which is
  # a decision, not an update.
  - package-ecosystem: "docker"
    directory: "/template"
    schedule:
      interval: "weekly"
    groups:
      base-images:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
