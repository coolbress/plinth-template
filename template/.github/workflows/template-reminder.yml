# A monthly reminder when this repository's template tag (`_commit` in
# `.copier-answers.yml`, which nothing raises) is behind the tag the plinth
# commit ci.yml calls is tested with. That commit's
# `scripts/floor-check.py --print-update-command` decides, as for
# `ci / floor-check` and `/plinth:template-update`: exit 0 with a command line
# opens one issue, or updates the open one. Its own "nothing to update" for the
# tag `_commit` records closes the open one with a comment; anything else,
# "ahead" included, logs why and leaves it as it is. It never runs
# `copier update` or opens a pull request, and it is not a check. It reads no
# pull request either: with these permissions `gh pr list` and the REST list
# answer 403 and the issues list leaves them out (measured on a private
# repository), so the issue links to Dependabot's instead of naming one.
# GitHub turns a scheduled workflow off in a public repository after 60 days
# without activity; turn it back on in the Actions tab.
name: Template reminder

on:
  schedule:
    - cron: "17 6 3 * *"   # 06:17 UTC on the 3rd of each month
  workflow_dispatch:

# Nothing for the file; the one job asks for what it uses.
permissions: {}

# A run by hand waits for the scheduled one: two runs never open two issues.
concurrency:
  group: template-reminder
  cancel-in-progress: false

jobs:
  remind:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Only what this job does. `contents: read` is the checkout's: without it
    # a private repository answers "Repository not found" (measured).
    permissions:
      contents: read  # to check out this repository
      issues: write   # to open, update or close the reminder issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here pushes
          path: project

      # The plinth commit ci.yml calls, and from it the three files the checker
      # reads, as `ci / floor-check` fetches them: no action, no permission.
      - name: Fetch the checker from the plinth commit ci.yml calls
        run: |
          set -euo pipefail
          pins="$(grep -oE 'coolbress/plinth/\.github/workflows/python-ci\.yml@[0-9a-f]{40}' project/.github/workflows/ci.yml | sort -u || true)"
          if [ "$(printf '%s\n' "$pins" | grep -c .)" != 1 ]; then
            echo "no reminder: ci.yml does not call coolbress/plinth's python-ci.yml at exactly one full commit SHA (found: ${pins:-none})"
            exit 0
          fi
          sha="${pins##*@}"
          d="$RUNNER_TEMP/plinth"; mkdir -p "$d/lib"
          fetch() { curl -fsSL --retry 3 -o "$d/$1" "https://raw.githubusercontent.com/coolbress/plinth/$sha/scripts/$1"; }
          # A pin older than a file answers 404: green, and no partial checker.
          if ! { fetch floor-check.py && fetch new-project.sh && fetch lib/shared-github.sh; }; then
            rm -rf "$d"
            echo "no reminder: a file the checker needs could not be fetched from plinth $sha (curl's error is above; a pin from before the file existed answers 404)"
            exit 0
          fi
          echo "plinth $sha"

      - name: Open or update the reminder issue
        env:
          GH_TOKEN: ${{ github.token }}
          PLINTH: ${{ runner.temp }}/plinth
          PROJECT: project
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          rc=0
          out="$(python3 "$PLINTH/floor-check.py" --root "$PROJECT" --repo "$GITHUB_REPOSITORY" --print-update-command 2> "$RUNNER_TEMP/why")" || rc=$?
          cat "$RUNNER_TEMP/why"
          # Empty when the file is missing: the fetch step fetched nothing.
          field() { { sed -nE "s/^$1[:=] *\"?([^\"]*)\"?\$/\1/p" "$2" 2>/dev/null || true; } | head -1; }
          current="$(field _commit "$PROJECT/.copier-answers.yml")"
          target="$(field template_ref "$PLINTH/new-project.sh")"
          template="$(field template_repo "$PLINTH/new-project.sh")"
          marker='<!-- plinth:template-reminder -->'
          # The open reminder this workflow wrote: its body starts with the
          # marker and the Actions bot opened it. Someone else's is never touched.
          ours() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,body,author \
              | jq -r --arg m "$marker" '[.[] | select((.author.login == "app/github-actions" or .author.login == "github-actions[bot]") and (.body | startswith($m)))] | first | .number // empty'
          }
          if [ "$rc" != 0 ] || ! grep -q '^uvx .* copier update ' <<<"$out"; then
            # Up to date is read, never inferred from "no line": floor-check
            # exits 1 too when it cannot verify. Its own "nothing to update" for
            # this tag, and `_commit` equal to `template_ref`, both or nothing.
            if [ "$rc" = 1 ] && [ -n "$target" ] && [ "$current" = "$target" ] \
              && grep -qxF "no update command: the recorded tag is the target tag ($target): nothing to update" "$RUNNER_TEMP/why"; then
              open="$(ours)"
              if [ -n "$open" ]; then
                gh issue close "$open" --repo "$GITHUB_REPOSITORY" --reason completed \
                  --comment "This repository is now on template tag **$target**, the tag plinth is tested with: nothing to update. Closed by $RUN_URL."
                echo "closed the reminder: issue #$open"
              else
                echo "no reminder: up to date at $target, and no open reminder to close"
              fi
              exit 0
            fi
            echo "no reminder: floor-check.py printed no update command (exit $rc); its reason is above"
            exit 0
          fi
          if [ "$current" = "$target" ]; then
            title="Template update available: re-render $target"
            what="This repository is on template tag **$target**, the tag plinth is tested with, and the update line re-renders it at that tag: an answer about the owner's shared files changed since it was made."
          else
            title="Template update available: $current to $target"
            what="This repository was made from template tag **$current**. Tag **$target** is available: the tag the plinth commit this repository's CI calls is tested with."
          fi
          body="$RUNNER_TEMP/body.md"
          cat > "$body" <<EOF
          $marker
          $what

          What changed: https://github.com/$template/releases/tag/$target (every release: https://github.com/$template/releases).

          Do these in order. [The how-to](https://github.com/$GITHUB_REPOSITORY/blob/HEAD/docs/how-to/keep-this-project-current.md) says what each brings and how to tell it is done.

          1. **Update plinth on your computer.** It decides which template tag step 2 moves to. In a terminal, run \`claude plugin marketplace update plinth\`, then \`claude plugin update plinth@plinth\`. Then type \`/reload-plugins\` in Claude Code, or start a new session.
          2. **Apply the template update.** Run \`/plinth:template-update\` in Claude Code in this repository. It shows its plan first and asks before it writes anything. Nothing here applies the update: it can conflict with this repository's own changes, and it needs a person's yes.
          3. **Merge the plinth pin pull request, if one is open.** This reminder cannot read pull requests. [Dependabot's open ones naming plinth](https://github.com/$GITHUB_REPOSITORY/pulls?q=is%3Apr+is%3Aopen+author%3Aapp%2Fdependabot+coolbress%2Fplinth) raise the commit of plinth this repository's checks run from, and are merged on green like any other.

          This issue is updated, not duplicated, while it is open, and closed by the first run after the update is merged, when this repository is on the tag named here. A newer plinth from step 1 can move this repository past the tag named here: this issue then stays open until the pull request in step 3 catches up, or you close it by hand. Last checked by $RUN_URL.

          GitHub turns off scheduled workflows in a public repository after 60 days without activity. If this reminder stops, turn \`Template reminder\` back on in the Actions tab.
          EOF
          open="$(ours)"
          if [ -n "$open" ]; then
            gh issue edit "$open" --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
            echo "updated the reminder: issue #$open"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$body"
          fi
