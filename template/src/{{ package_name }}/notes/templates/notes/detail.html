<!doctype html>
<html lang="en">
<title>Note</title>
<main>
<h1>Note</h1>
<p id="text">{{ note.text }}</p>
<form method="post">{% csrf_token %}<label for="note">Note</label> <input id="note" name="text" value="{{ note.text }}" maxlength="200" required> <button>Save</button></form>
<p><a href="{% url 'notes' %}">All notes</a></p>
</main>
