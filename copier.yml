# copier configuration.
#
# Why copier and not a GitHub template repository: `gh repo create --template`
# is a point-in-time copy with no link back. copier leaves `.copier-answers.yml`
# in the instance, so `copier update` can merge later template changes.
#
# The root of this repository is the template's own project (its CI, its
# tests); only `template/` is rendered into an instance. Name substitution is
# jinja, decided before any file is written: a name that cannot become a
# Python package is refused by the validator below before anything exists.

_min_copier_version: "9.0.0"

# `CLAUDE.md` is a symbolic link to `AGENTS.md`. Without this copier follows
# the link and writes a copy, and the two drift apart.
_preserve_symlinks: true
# The link's source is `CLAUDE.md.jinja` -> `AGENTS.md`: `AGENTS.md` exists only
# once `AGENTS.md.jinja` is rendered, and a dangling `CLAUDE.md` in this
# repository crashes plinth's floor checker, which reads every `*.md` here.
# copier drops the suffix from the link's name and keeps its target.

# Only `template/` is rendered. The root `copier.yml`, `src/`, `tests/` and
# the template's own CI are never candidates, so nothing here needs excluding.
_subdirectory: template

_exclude:
  - .venv
  - dist
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - __pycache__
  # Conditional on the archetype. The files are not deleted after rendering;
  # they are never written, so no stub is left behind. The checker in plinth
  # (`scripts/floor-check.py`) names the same archetypes; its test reads
  # this file over the network, so keep the condition on one line.
  - "{% if archetype not in ['backend', 'data-ml', 'web'] %}.env.example{% endif %}"
  # Its source is `{{ "" }}.env.example.jinja`, which renders to
  # `.env.example`: the instance's `.gitignore` in `template/` ignores
  # `.env.*`, and copier, rendering a working tree with uncommitted changes,
  # leaves out a file that rule matches, even a tracked one.
  # A container image is four files together: the image, the build-context
  # exclusions, the entry point the image runs, and nothing else. The image
  # alone is a stub.
  - "{% if archetype not in ['backend', 'data-ml', 'web'] %}Dockerfile{% endif %}"
  - "{% if archetype not in ['backend', 'data-ml', 'web'] %}.dockerignore{% endif %}"
  # The entry point is also what a `cli` project runs, without an image. A
  # `library` has none: a person imports it. The condition is written as
  # `==`, not `not in`, because plinth's floor checker reads the first
  # `not in` list above as the image archetypes.
  - "{% if archetype == 'library' %}src/{{ package_name }}/__main__.py{% endif %}"
  # The test of that entry point and the output it is compared with; a
  # `library` instead tests its public name imported from the built wheel.
  # `web` tests its own entry point in `tests/test_<package>.py`.
  - "{% if archetype in ['library', 'web'] %}tests/test_entry_point.py{% endif %}"
  - "{% if archetype in ['library', 'web'] %}tests/entry_point.expected{% endif %}"
  # The built wheel: a `library` imports its public name from it, a `cli`
  # installs it and runs the command it puts on PATH.
  - "{% if archetype in ['backend', 'data-ml', 'web'] %}tests/test_built_wheel.py{% endif %}"
  # The web archetype's Django project: its settings, routes, the ASGI
  # application the entry point serves, the pre-deploy step, and Django's
  # command line.
  - "{% if archetype != 'web' %}src/{{ package_name }}/settings.py{% endif %}"
  - "{% if archetype != 'web' %}src/{{ package_name }}/urls.py{% endif %}"
  - "{% if archetype != 'web' %}src/{{ package_name }}/asgi.py{% endif %}"
  - "{% if archetype != 'web' %}src/{{ package_name }}/predeploy.py{% endif %}"
  - "{% if archetype != 'web' %}manage.py{% endif %}"
  - "{% if archetype != 'web' %}tests/conftest.py{% endif %}"
  - "{% if archetype != 'web' %}src/{{ package_name }}/notes{% endif %}"
  - "{% if archetype != 'web' %}tests/test_access.py{% endif %}"
  - "{% if archetype != 'web' %}tests/test_pages.py{% endif %}"
  - "{% if archetype != 'web' %}tests/migration_rows.json{% endif %}"
  # The data-ml archetype's model: the training run, its test, and the card
  # each release publishes beside the model (coolbress/plinth#716).
  - "{% if archetype != 'data-ml' %}src/{{ package_name }}/train.py{% endif %}"
  - "{% if archetype != 'data-ml' %}tests/test_train.py{% endif %}"
  - "{% if archetype != 'data-ml' %}MODEL_CARD.md{% endif %}"
  # Publishing on a version tag, and the person's steps around it: a `cli` or
  # `library` publishes its package to PyPI (coolbress/plinth#703), a
  # `backend` its image to GHCR (coolbress/plinth#706), a `data-ml` its
  # model, metrics and card to a GitHub Release (coolbress/plinth#716). The
  # three workflows are three source files whose names render to
  # `release.yml` for their archetypes and to nothing otherwise, and copier
  # writes no file whose name renders empty. `web` has none: it deploys on
  # green. Written `==`, not `not in`, for the floor checker's sake (above).
  # On GitLab the workflow is already out with `.github`, and its how-to goes
  # with it.
  - "{% if archetype == 'web' or host == 'gitlab' %}docs/how-to/publish-a-release.md{% endif %}"
  # The directory too, while that page is all it holds: excluding only the
  # file leaves an empty directory.
  - "{% if archetype == 'web' or host == 'gitlab' %}docs/how-to{% endif %}"
  # Render's Blueprint, only where the app runs on Render (`hosting` below).
  - "{% if archetype != 'web' or hosting != 'render' %}render.yaml{% endif %}"
  # The owner's shared community-health files, when they publish them. GitHub
  # applies `owner/.github`'s copy to a repository that has none of its own, so
  # writing ours would silently replace the owner's convention. The door answers
  # these two; a person rendering by hand keeps the defaults and gets ours.
  #
  # Two answers, not one: GitHub decides the pull-request template per file and
  # the issue templates per folder. A single local form -- or just a
  # `config.yml` -- stops the whole shared folder being inherited, and the two
  # sets are never merged, so the folder is all or nothing.
  # `| string | lower == 'true'`, not a bare truth test: the door supplies these
  # through `copier --data`, which does not coerce to the declared type, and a
  # bare `{% if %}` on the string "false" is true. Measured, 2026-09-08.
  # The issue folder needs `/**`: a bare directory name matches nothing here.
  - "{% if owner_has_pr_template | string | lower == 'true' %}.github/PULL_REQUEST_TEMPLATE.md{% endif %}"
  - "{% if owner_has_issue_forms | string | lower == 'true' %}.github/ISSUE_TEMPLATE/**{% endif %}"
  # One host's files only. On GitLab nothing under `.github/` is written: no
  # workflow, Dependabot, issue form or pull-request template, which GitLab
  # would not read. On GitHub no `.gitlab-ci.yml` or `.gitlab/`.
  # The directory and its contents: `/**` alone leaves an empty directory.
  - "{% if host == 'gitlab' %}.github{% endif %}"
  - "{% if host == 'gitlab' %}.github/**{% endif %}"
  - "{% if host != 'gitlab' %}.gitlab-ci.yml{% endif %}"
  - "{% if host != 'gitlab' %}.gitlab{% endif %}"
  - "{% if host != 'gitlab' %}.gitlab/**{% endif %}"

project_name:
  type: str
  help: Repository name (GitHub rules). Example my-app
  # A repository name and a Python package name follow different rules: GitHub
  # allows `.` and a leading digit, Python does not. The package name is
  # derived from the repository name below; when that derivation cannot be a
  # Python identifier, stop here, before writing a single file.
  validator: >-
    {%- set pkg = project_name | regex_replace('[-. ]', '_') | lower -%}
    {%- if not project_name -%}
    The name is empty.
    {%- elif not (pkg | regex_search('^[a-z_][a-z0-9_]*$')) -%}
    No Python package name can be made from '{{ project_name }}': '{{ pkg }}'
    {% if pkg[:1] is match('[0-9]') %}starts with a digit{% else %}contains a character an identifier cannot{% endif %}.
    Choose another repository name.
    {%- elif pkg in [
      'and','as','assert','async','await','break','class','continue','def','del','elif','else',
      'except','finally','for','from','global','if','import','in','is','lambda','nonlocal','not',
      'or','pass','raise','return','try','while','with','yield'
    ] -%}
    The package name '{{ pkg }}' derived from '{{ project_name }}' is a Python keyword;
    it cannot be imported. Choose another repository name.
    {%- endif -%}

# Derived, never asked. Its default still reaches the render context.
# One derivation in one place: an earlier generation had the rule in a shell
# script as well, and the two disagreed between macOS and Linux.
package_name:
  type: str
  when: false
  default: "{{ project_name | regex_replace('[-. ]', '_') | lower }}"

# The GitHub account or organization the repository lives under. Rendered
# into pyproject's author and URLs. `/plinth:new-project` passes it; a person
# running copier by hand is asked. Empty means unknown: no author, no URLs.
owner:
  type: str
  help: Owner of the repository (a GitHub user or organization, or a GitLab namespace). Example my-org
  default: ""

license:
  type: str
  help: SPDX license identifier
  default: MIT
  choices:
    MIT: MIT
    Apache-2.0: Apache-2.0

# This generator produces a Python package (pyproject, hatchling, uv.lock,
# src/<package>/, plinth's python-ci). The choices are only what it can
# actually build: a single-page front end or a mobile app would come out as a
# plain Python package, so they are not offered. `web` is a server-rendered
# Django app with Postgres, on GitHub only (plinth #604).
#
# The yes/no axes (published, cloud, handles user data) are not asked here:
# they change later and are not a kind of project.
archetype:
  type: str
  help: |
    What kind of project this is. The conditional files depend on it
    (`.env.example` and a container image belong to a running service).
    When unsure, choose the narrowest.
    Web app with a database costs money to run: about US $13 a month on
    Render (a $7 web service and a $6 Postgres), besides the Claude
    subscription. Free Postgres is not supported (deleted after 30 days, no
    backups), and Render has no spending cap.
  default: cli
  choices:
    CLI: cli
    Library: library
    Backend or API service: backend
    Data or ML: data-ml
    Web app with a database: web

# The commit of coolbress/plinth whose reusable workflows the instance calls,
# the one this template release was tested with. It is the only pin the
# template carries, and the instance's Dependabot raises it afterwards.
#
# Recorded, not computed, and that is the whole point of the question. While
# it was `when: false` copier neither wrote it to the answers file nor let
# `--data` override it, so every `copier update` re-rendered the pin from this
# default: an instance whose Dependabot had raised it got a conflict in each
# workflow file, and one whose Dependabot had not was moved back to this
# value without a word. Asked, it is written into `.copier-answers.yml` and an
# update that passes the instance's own pin keeps it (#22).
plinth_sha:
  type: str
  help: |
    Commit of coolbress/plinth whose reusable workflows this project calls.
    Press Enter for the one this template release was tested with; on an
    update, pass the pin the repository has now.
  default: "d50950bb50538680c508b0fe35498da4e8723dfa"
  # A branch, a tag or a short SHA can move or be ambiguous, and on GitLab a
  # moved ref fails every pipeline against the recorded checksum.
  validator: >-
    {%- if not (plinth_sha | regex_search('^[0-9a-f]{40}$')) -%}
    plinth_sha '{{ plinth_sha }}' is not a full commit SHA (40 lowercase hex
    characters). Pass the commit, not a branch, a tag or a short SHA.
    {%- endif -%}

# Where the repository lives and what holds the wall outside the agent: the
# protected branch, the required checks, the pipeline. GitHub is what every
# instance had before the question existed; GitLab (GitLab.com Free) gets the
# pipeline plinth ships for it, coolbress/plinth's `gitlab/python-ci.yml`,
# with the same job names. Only the CI file, the issue and merge request
# templates and host-specific text differ.
host:
  type: str
  help: Where the repository lives
  default: github
  choices:
    GitHub: github
    GitLab: gitlab
  # The web archetype's hosting path deploys from GitHub (plinth #604).
  validator: >-
    {%- if host == 'gitlab' and archetype == 'web' -%}
    The web archetype is GitHub only: its deployment and checks are built for
    GitHub. Choose GitHub, or another archetype for GitLab.
    {%- endif -%}

# Where a `web` app runs (coolbress/plinth #639). plinth builds and checks one
# place, Render; the others are listed, not built: they leave out
# `render.yaml`, and the README carries the chosen place's steps and what the
# person takes on, from plinth's how-to "Choose where a web app runs".
#
# Neither question is `when: false`, and neither may become it. copier does
# not record an answer it did not ask, and a later `--data` cannot reach one:
# an instance would lose its choice at the first `copier update` (#22). The
# first is asked whenever the archetype is `web`, the second whenever the
# first is `elsewhere`. On any other archetype neither is asked or recorded.
hosting:
  type: str
  when: "{{ archetype == 'web' }}"
  help: |
    Where will your app run?
    Render (recommended): about $13 a month. It puts your app online at a
    secure https:// address (the padlock in the browser), puts out a new
    version only after the project's automatic tests pass, and can bring your
    data back as it was at any moment from 3 days ago up to 10 minutes ago.
    plinth has tried every step of this.
    Somewhere else: another hosting service, a server you rent or a computer
    at home. plinth has not tried them, and does not deploy there.
  default: render
  choices:
    Render (recommended): render
    Somewhere else: elsewhere

# No default: a place plinth has not checked is never chosen by pressing
# Enter or by leaving the answer out of `--data`.
hosting_elsewhere:
  type: str
  when: "{{ archetype == 'web' and hosting == 'elsewhere' }}"
  help: |
    Where else, from least to most work for you. plinth does not deploy to
    any of these.
    Another hosting service (Railway, DigitalOcean, Fly.io): from about $10 to
    $42 a month. Similar, but plinth has not tried them: some put out a new
    version even when its tests fail, and on some, backups stay off until you
    switch them on.
    A server you rent: from about €6 a month for more power, but keeping it
    updated, secure and backed up is your job every month.
    A computer at home: free to try on your own network. Putting it on the
    internet is the riskiest choice: anyone can reach it, a flaw can lead into
    your home network, and your data is only as safe as the backups you make
    yourself.
  choices:
    Railway: railway
    DigitalOcean App Platform: digitalocean
    Fly.io: fly
    A server you rent: vps
    A computer at home: home

# The SHA-256 of plinth's `gitlab/python-ci.yml` at `plinth_sha`, base64, for
# the include's `integrity:`: GitLab refuses an included file whose bytes
# differ, before any job runs (measured on GitLab.com Free, plinth #353).
# The default is the checksum at the default `plinth_sha`. Nothing here can
# compute another, and nothing refuses the default with another pin: the file
# can have the same bytes at another commit, and a checksum that does not
# match fails the pipeline with "failed integrity check", visibly, until the
# right one is passed. Recorded in the answers file, so an update that passes
# the instance's own pin and checksum keeps both.
plinth_gitlab_integrity:
  type: str
  when: "{{ host == 'gitlab' }}"
  help: |
    SHA-256 of plinth's gitlab/python-ci.yml at plinth_sha, base64 (the
    include's integrity). Press Enter for the default pin's; with another pin,
    pass that commit's (curl the file, then openssl dgst -sha256 -binary |
    openssl base64 -A).
  default: "m+mG7HTJyN1UEWKqP7nXkEC7zkxYtGGc80kBD+JVDIM="
  validator: >-
    {%- if host == 'gitlab' and not (plinth_gitlab_integrity | regex_search('^[A-Za-z0-9+/]{43}=$')) -%}
    plinth_gitlab_integrity is not a base64 SHA-256 (44 characters ending in =).
    For plinth_sha {{ plinth_sha }}:
    curl -fsSL https://raw.githubusercontent.com/coolbress/plinth/{{ plinth_sha }}/gitlab/python-ci.yml | openssl dgst -sha256 -binary | openssl base64 -A
    {%- endif -%}

# Does the owner already publish these in their `.github` repository? The door
# looks, and passes the answer in; it never renders and then deletes, because a
# file that was written and removed leaves a stub in the history.
#
# Default false on both: a person rendering by hand, with no way to look, gets
# the template's own copies rather than a repository with no forms at all. A
# lookup that failed is not an answer -- the door stops and asks rather than
# passing a guess.
#
# Asked, not `when: false`, for the reason `plinth_sha` is: copier records
# only an answer it asked. While these were `when: false`, `.copier-answers.yml`
# had neither, so a `copier update` that did not pass them read both as false,
# and a form added to the template later reached an instance of an owner with
# shared forms as one local file, which hides the whole shared set
# (coolbress/plinth#726). Recorded, an update keeps the answer; plinth's update
# line also looks again and passes it, for an instance made before this and
# for an owner whose `.github` changed since. Asked on GitHub only: on GitLab
# nothing under `.github/` is written, whatever the answer.
owner_has_pr_template:
  type: bool
  when: "{{ host != 'gitlab' }}"
  help: |
    Does the owner's public .github repository publish a pull-request
    template? Then this project writes none, so the owner's applies.
    Press Enter for no: this project writes its own.
  default: false

owner_has_issue_forms:
  type: bool
  when: "{{ host != 'gitlab' }}"
  help: |
    Does the owner's public .github repository publish issue forms in
    .github/ISSUE_TEMPLATE? Then this project writes none: one local form
    hides every shared one. Press Enter for no: this project writes its own.
  default: false
